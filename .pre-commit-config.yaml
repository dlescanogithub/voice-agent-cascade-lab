repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: secretscan
        name: secretscan
        entry: python -m voice_cascade secretscan
        language: system
        pass_filenames: false
